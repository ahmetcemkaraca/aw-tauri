[package]
name = "peakactivity-desktop"
version = "0.1.0"
description = "PeakActivity desktop, derived from ActivityWatch"
authors = ["Erik Bjäreholt <erik@bjareho.lt>", "Brian Vuku <brayo@brayo.dev>"]
license = "MPL-2.0"
edition = "2021"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "peakactivity"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aw_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
clap = { version = "4", features = ["derive"] }
shell-words = "1.1.0"
tauri = { version = "2.2.2", features = ["tray-icon"] }
tauri-plugin-shell = "2.2.0"
tauri-plugin-dialog = "2.2.0"
tauri-plugin-notification = "2.2.1"
tauri-plugin-single-instance = "2.2.1"
tray-icon = { version = "0.21.3", default-features = false }
tao = "0.34.5"

tokio = { version = "1", features = ["rt-multi-thread"] }
notify = "8.0.0"
notify-rust = "4.12.0"
dirs = "5.0.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.140"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
base64 = "0.22"
toml = "0.9.5"
lazy_static = "1.5.0"
log = "0.4.25"
fern = { version = "0.7.1", features = ["colored"] }
chrono = "0.4.39"
aw-models = { path = "../../aw-server-rust/aw-models" }
aw-server = { path = "../../aw-server-rust/aw-server", default-features = false, features = ["encryption-vendored"] }
aw-datastore = { path = "../../aw-server-rust/aw-datastore", default-features = false, features = ["encryption-vendored"] }
aw-sync-e2ee = { path = "../../aw-server-rust/aw-sync-e2ee" }
aw-entitlements = { path = "../../aw-server-rust/aw-entitlements" }
tauri-plugin-opener = "2"
glob = "0.3.1"
open = "5.3.3"
png = "0.17.16"
getrandom = "0.2"
zeroize = { version = "1", features = ["alloc"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29.0", features = ["process", "signal"] }
libc = "0.2"
[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
winapi = { version = "0.3.9", features = ["winuser", "jobapi2", "handleapi", "processthreadsapi", "winnt", "winbase"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.2.0"
